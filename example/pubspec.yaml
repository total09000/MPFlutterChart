name: mp_flutter_chart_example
description: "Example app of mp_flutter_chart: a home list with one chart page per entry, in the Nightfall style."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  mp_flutter_chart:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # MPChartExample's assets (src/main/assets): the point files its pages read and the Open Sans faces its charts use.
  assets:
    - assets/cosine.txt
    - assets/n.txt
    - assets/nlogn.txt
    - assets/othersine.txt
    - assets/sine.txt
    - assets/square.txt
    - assets/three.txt

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
